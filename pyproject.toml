[project]
name = "civiclens"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic-settings>=2.7",
  "python-multipart>=0.0.20",
  "supabase>=2.11",
  "Pillow>=11.0",
  "google-generativeai>=0.8",
  "sentence-transformers>=3.3",
]

[project.optional-dependencies]
test = ["pytest>=8.3", "httpx>=0.28"]

